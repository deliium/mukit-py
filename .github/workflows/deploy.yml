name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mukit
          POSTGRES_PASSWORD: mukit
          POSTGRES_DB: mukit_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend setup and linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit safety pytest pytest-asyncio httpx pytest-cov

      - name: Run backend linters
        working-directory: ./backend
        run: |
          echo "Running Ruff linter..."
          ruff check app/ --show-fixes || exit 1
          
          echo "Running Ruff formatter check..."
          ruff format app/ --check --diff || exit 1
          
          echo "Running MyPy type checker..."
          mypy app/ --show-error-codes --strict || exit 1
          
          echo "Running Bandit security linter..."
          bandit -r app/ -f json -o bandit-report.json || exit 1
          
          echo "Running pip-audit..."
          pip-audit --format=json --output=pip-audit-report.json || true

      # Frontend setup and linting
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linters
        working-directory: ./frontend
        run: |
          echo "Running ESLint..."
          npm run lint || exit 1
          
          echo "Running Prettier check..."
          npm run format:check || exit 1
          
          echo "Running TypeScript type check..."
          npm run type-check || exit 1

      # Backend tests
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U mukit; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://mukit:mukit@localhost:5432/mukit_test
        run: |
          python -m pytest tests/ -v --tb=short || exit 1

      # Frontend tests
      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm run test:run || exit 1

  deploy:
    name: Deploy to VPS
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "❌ Error: SSH_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "❌ Error: SSH_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "❌ Error: DEPLOY_PATH secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Set up Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          echo "🏗️  Building frontend production bundle..."
          npm run build
          echo "✅ Frontend build completed"

      - name: Deploy backend to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          echo "📦 Deploying backend code to server..."
          
          # Create backend directory structure
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_PATH/backend"
          
          # Copy backend code to server using tar (more reliable than rsync)
          # Create a tar archive excluding unnecessary files
          tar --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pytest_cache' \
              --exclude='.env' \
              --exclude='uploads' \
              --exclude='*.log' \
              --exclude='test.db' \
              --exclude='pip-audit-report.json' \
              --exclude='bandit-report.json' \
              -czf - -C backend . | \
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "cd $DEPLOY_PATH && tar -xzf - -C backend"
          
          # Create uploads directory if it doesn't exist
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_PATH/backend/uploads"
          
          echo "✅ Backend code deployed"
          
          # Setup and deploy on server
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST bash << REMOTE_EOF
            set -e
            cd $DEPLOY_PATH
            
            echo "📝 Creating/updating backend .env file..."
            cat > backend/.env << ENVEOF
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          SECRET_KEY=$SECRET_KEY
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          ENVEOF
            
            cd backend 
            echo "🐍 Setting up Python virtual environment..."
            if [ ! -d ".venv" ]; then
              python3.12 -m venv .venv
            fi
            source .venv/bin/activate
            
            echo "📦 Upgrading pip, setuptools, and wheel..."
            pip install --upgrade pip setuptools wheel
            
            echo "📦 Installing Python dependencies..."
            pip install --no-cache-dir --index-url https://pypi.org/simple/ -r requirements.txt || {
              echo "❌ Failed to install dependencies. Trying without explicit index..."
              pip install --no-cache-dir -r requirements.txt
            }
            
            echo "🗄️  Running database migrations..."
            alembic upgrade head
            
            echo "🔄 Restarting backend service..."
            
            echo "⏳ Waiting for services to start..."
            sleep 5
            
            echo "✅ Backend deployment completed!"
          REMOTE_EOF

      - name: Deploy frontend build to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "📦 Deploying frontend build to server..."
          
          # Verify frontend/dist exists locally
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Error: frontend/dist directory not found. Make sure frontend is built first."
            exit 1
          fi
          
          # Create frontend directory structure on server if it doesn't exist
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "mkdir -p '$DEPLOY_PATH/frontend'"
          
          # Verify directory was created
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "test -d '$DEPLOY_PATH/frontend' || { echo 'Failed to create frontend directory'; exit 1; }"
          
          # Copy contents of dist directory to server using tar (more reliable than scp for directories)
          echo "Copying frontend/dist contents to server..."
          tar -czf - -C frontend/dist . | \
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "cd '$DEPLOY_PATH/frontend' && tar -xzf -"
          
          # Verify copy was successful (check for index.html or any dist file)
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "test -f '$DEPLOY_PATH/frontend/index.html' || { echo 'Failed to copy frontend files'; exit 1; }"
          
          echo "✅ Frontend build deployed successfully"

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "🏥 Performing health check..."
          API_URL=$(echo "${{ secrets.VITE_API_URL }}" | sed 's|/api/v1||')
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "curl -f $API_URL/health || echo '⚠️  Health check failed'" || true

