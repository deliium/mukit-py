server {
    listen 80;
    server_name your-domain.com;

    # Proxy to Node.js frontend server
    # For port mode: proxy_pass http://localhost:3333;
    # For socket mode: proxy_pass http://unix:/var/run/mukit-frontend.sock;
    location / {
        # For port mode:
        proxy_pass http://localhost:3333;
        # For socket mode (uncomment if using socket):
        # proxy_pass http://unix:/var/run/mukit-frontend.sock;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Backend API proxy
    # For port mode: proxy_pass http://localhost:8888;
    # For socket mode: proxy_pass http://unix:/var/run/mukit-backend.sock;
    location /api/ {
        proxy_pass http://localhost:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy
    # For port mode: proxy_pass http://localhost:8888;
    # For socket mode: proxy_pass http://unix:/var/run/mukit-backend.sock;
    location /ws {
        proxy_pass http://localhost:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

